<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#f0f4f9;height:100vh;display:flex;justify-content:center;align-items:center;color:#1a1a2e}
.chat-container{width:100%;max-width:740px;height:100vh;max-height:900px;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 6px 28px rgba(0,0,0,.07);position:relative}
@media(max-width:760px){.chat-container{max-height:none;box-shadow:none;height:100vh}}
.chat-header{background:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8edf2;position:sticky;top:0;z-index:10}
.chat-header .h-avatar{width:36px;height:36px;border-radius:10px;background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.chat-header .h-avatar img{width:36px;height:36px;object-fit:cover}
.chat-header .h-info{flex:1;min-width:0}
.chat-header .h-info h1{font-size:15px;font-weight:700;color:#1a1a2e;letter-spacing:-.01em}
.chat-header .h-info .h-status{display:flex;align-items:center;gap:5px;margin-top:2px}
.chat-header .h-info .h-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-header .h-info .h-label{font-size:11px;color:#8896a6}
.chat-header .h-badge{font-size:10px;background:#f5f3ff;color:#7c3aed;padding:3px 10px;border-radius:10px;font-weight:600;letter-spacing:.02em;flex-shrink:0}
.chat-header .h-clear{background:none;border:none;color:#9aa6b5;cursor:pointer;padding:5px;border-radius:7px;display:flex;transition:all .2s;flex-shrink:0}
.chat-header .h-clear:hover{background:#f0f4f9;color:#5a6a7a}
.chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:0;scroll-behavior:smooth;background:#fafbfc}
.chat-messages::-webkit-scrollbar{width:5px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:#d0d8e0;border-radius:8px}
.chat-messages::-webkit-scrollbar-thumb:hover{background:#b0bcc8}
.msg{display:flex;gap:10px;margin-bottom:18px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg .m-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:4px}
.msg.user .m-av{background:#ede9fe}
.msg.user .m-av svg{width:16px;height:16px;fill:#7c3aed}
.msg.bot .m-av{background:none}
.msg.bot .m-av img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.msg .m-wrap{display:flex;flex-direction:column;max-width:78%}
.msg .m-bubble{padding:10px 16px;line-height:1.65;font-size:14.5px;word-wrap:break-word;white-space:pre-wrap}
.msg.user .m-bubble{background:#7c3aed;color:#fff;border-radius:18px 18px 4px 18px}
.msg.bot .m-bubble{background:#fff;color:#1a1a2e;border-radius:4px 18px 18px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)}
.msg .m-foot{display:flex;align-items:center;gap:6px;margin-top:4px;opacity:0;transition:opacity .2s}
.msg:hover .m-foot{opacity:1}
.msg.user .m-foot{justify-content:flex-end}
.msg .m-foot .m-time{font-size:10px;color:#b0bcc8}
.msg .m-foot .m-copy{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:#c0cbd8;display:flex;transition:all .15s}
.msg .m-foot .m-copy:hover{background:#eef2f6;color:#7a8a9a}
.msg.user .m-foot .m-copy:hover{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.msg.bot .m-bubble p{margin:0 0 6px}
.msg.bot .m-bubble p:last-child{margin:0}
.typing-area{display:flex;gap:10px;margin-bottom:18px;padding-left:0;animation:msgIn .3s ease}
.typing-area .m-av{width:30px;height:30px;border-radius:50%;background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:4px}
.typing-area .m-av img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.typing-area .t-dots{display:flex;align-items:center;gap:4px;padding:12px 18px;background:#fff;border-radius:4px 18px 18px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04)}
.typing-area .t-dots span{width:7px;height:7px;border-radius:50%;background:#c0cbd8;animation:bounce 1.4s ease infinite}
.typing-area .t-dots span:nth-child(2){animation-delay:.2s}
.typing-area .t-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.typing-area.hidden{display:none}
.input-area{border-top:1px solid #e8edf2;padding:0 20px 20px;background:#fff}
.input-box{display:flex;align-items:flex-end;gap:10px;background:#f0f4f9;border:1px solid #e0e6ed;border-radius:14px;padding:6px 6px 6px 16px;transition:border-color .15s,box-shadow .2s}
.input-box:focus-within{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.input-box textarea{flex:1;border:none;background:transparent;padding:8px 0;font-size:14px;line-height:1.5;outline:none;resize:none;font-family:inherit;max-height:110px;color:#1a1a2e}
.input-box textarea::placeholder{color:#9aa6b5}
.input-box .s-btn{width:38px;height:38px;border-radius:10px;border:none;background:#7c3aed;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.input-box .s-btn:hover{background:#6d28d9}
.input-box .s-btn:active{transform:scale(.94)}
.input-box .s-btn:disabled{background:#b0bcc8;cursor:default;transform:none}
.input-box .s-btn svg{width:17px;height:17px;fill:currentColor}
.err{display:none;align-items:center;gap:8px;padding:10px 16px;margin:0 20px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#dc2626;font-size:13px;animation:msgIn .3s ease}
.err.show{display:flex}
.err svg{width:16px;height:16px;flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:50px 30px;text-align:center}
.empty .e-icon{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 8px 24px rgba(124,58,237,.2)}
.empty .e-icon svg{width:34px;height:34px;fill:#fff}
.empty h2{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.empty p{font-size:14px;color:#8896a6;max-width:420px;line-height:1.7;margin-bottom:18px}
.empty .e-sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.empty .e-sugs button{background:#fff;border:1px solid #e0e6ed;padding:8px 18px;border-radius:20px;font-size:13px;color:#4a5a6a;cursor:pointer;transition:all .2s;font-weight:500}
.empty .e-sugs button:hover{background:#7c3aed;border-color:#7c3aed;color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.25)}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="h-avatar">
      <img src="/static/bot.png" alt="Bot" style="width:100%;height:100%;border-radius:10px;object-fit:cover">
    </div>
    <div class="h-info">
      <h1>RAG Assistant</h1>
      <div class="h-status">
        <span class="h-dot"></span>
        <span class="h-label">Online &bull; Singapore PR Guide</span>
      </div>
    </div>
    <span class="h-badge">gemma3:4b</span>
    <button class="h-clear" onclick="clearHistory()" title="Clear conversation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
    </button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="empty" id="emptyState">
      <div class="e-icon">
        <img src="/static/bot.png" alt="Bot" style="width:42px;height:42px;object-fit:cover">
      </div>
      <h2>How can I help you?</h2>
      <p>I'm your AI assistant for Singapore PR. Ask me anything about eligibility, application processes, or requirements.</p>
      <div class="e-sugs">
        <button onclick="suggest('Who is eligible for Singapore PR?')">Eligibility for PR</button>
        <button onclick="suggest('What are the benefits of becoming a PR?')">Benefits of PR</button>
        <button onclick="suggest('How to apply for Singapore PR?')">How to apply PR</button>
        <button onclick="suggest('What documents are needed for PR application?')">Documents needed</button>
      </div>
    </div>
  </div>

  <div class="typing-area hidden" id="typingArea">
    <div class="m-av">
      <img src="/static/bot.png" alt="Bot" style="width:20px;height:20px;border-radius:50%;object-fit:cover">
    </div>
    <div class="t-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="err" id="errorBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    <span id="errorText">Failed to get response. Make sure Ollama is running.</span>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="userInput" rows="1" placeholder="Ask me anything about Singapore PR..." autofocus></textarea>
      <button class="s-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const typingArea = document.getElementById('typingArea');
const errBanner = document.getElementById('errorBanner');
const errText = document.getElementById('errorText');
const emptyState = document.getElementById('emptyState');

let curBotMsg = null;

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function suggest(t) {
  userInput.value = t;
  userInput.style.height = 'auto';
  sendMessage();
}

function time() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMsg(role, text) {
  emptyState.style.display = 'none';
  const el = document.createElement('div');
  el.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'm-av';
  if (role === 'user') {
    av.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
  } else {
    av.innerHTML = '<img src="/static/bot.png" alt="Bot" style="width:20px;height:20px;border-radius:50%;object-fit:cover">';
  }

  const wrap = document.createElement('div');
  wrap.className = 'm-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'm-bubble';
  bubble.textContent = text;

  const foot = document.createElement('div');
  foot.className = 'm-foot';

  const t = document.createElement('span');
  t.className = 'm-time';
  t.textContent = time();
  foot.appendChild(t);

  if (role === 'bot') {
    const cb = document.createElement('button');
    cb.className = 'm-copy';
    cb.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
    cb.title = 'Copy';
    cb.onclick = () => {
      navigator.clipboard.writeText(bubble.textContent);
      cb.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
      setTimeout(() => {
        cb.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
      }, 1800);
    };
    foot.prepend(cb);
  }

  wrap.appendChild(bubble);
  wrap.appendChild(foot);
  el.appendChild(av);
  el.appendChild(wrap);
  chatMessages.appendChild(el);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return bubble;
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || sendBtn.disabled) return;

  userInput.value = '';
  userInput.style.height = 'auto';
  errBanner.classList.remove('show');
  addMsg('user', text);

  sendBtn.disabled = true;
  typingArea.classList.remove('hidden');

  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (!r.ok) throw new Error();

    typingArea.classList.add('hidden');
    curBotMsg = addMsg('bot', '');

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        try {
          const p = JSON.parse(d);
          if (p.token) {
            curBotMsg.textContent += p.token;
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        } catch {}
      }
    }
  } catch {
    typingArea.classList.add('hidden');
    if (curBotMsg && !curBotMsg.textContent) {
      curBotMsg.closest('.msg').remove();
      curBotMsg = null;
    }
    errText.textContent = 'Failed to get response. Make sure Ollama is running.';
    errBanner.classList.add('show');
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

async function clearHistory() {
  try {
    await fetch('/history', { method: 'DELETE' });
    chatMessages.querySelectorAll('.msg').forEach(e => e.remove());
    emptyState.style.display = 'flex';
    errBanner.classList.remove('show');
  } catch {}
}
</script>
</body>
</html>
