<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chatbot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;height:100vh;display:flex;justify-content:center;align-items:center}
.chat-container{width:100%;max-width:700px;height:100vh;max-height:850px;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 20px rgba(0,0,0,0.1)}
.chat-header{background:#2b3a55;color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px}
.chat-header h1{font-size:18px;font-weight:600}
.chat-header .status{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block}
.chat-header .subtitle{font-size:12px;opacity:.8;margin-left:auto}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.message{max-width:80%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:14px;word-wrap:break-word;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{background:#2b3a55;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.message.assistant{background:#f0f2f5;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:4px}
.message.assistant p{margin:0 0 8px}
.message.assistant p:last-child{margin:0}
.chat-input{display:flex;padding:16px 20px;border-top:1px solid #e0e0e0;background:#fff;gap:10px}
.chat-input input{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:24px;font-size:14px;outline:none;transition:border .2s}
.chat-input input:focus{border-color:#2b3a55}
.chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:#2b3a55;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.chat-input button:hover{background:#1f2c42}
.chat-input button:disabled{opacity:.5;cursor:default}
.chat-input button svg{width:20px;height:20px;fill:#fff}
.typing-indicator{display:none;padding:12px 16px;background:#f0f2f5;border-radius:16px;align-self:flex-start;border-bottom-left-radius:4px;gap:4px}
.typing-indicator.show{display:flex}
.typing-indicator span{width:7px;height:7px;border-radius:50%;background:#999;animation:bounce 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.error-msg{color:#d32f2f;font-size:12px;padding:4px 16px 0;display:none}
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <span class="status"></span>
    <h1>RAG Assistant</h1>
    <span class="subtitle">Singapore PR Guide</span>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="message assistant">Hello! I'm your Singapore PR assistant. Ask me anything about PR applications.</div>
  </div>
  <div class="typing-indicator" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask about Singapore PR..." autofocus>
    <button id="sendBtn" onclick="sendMessage()" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');
const errorMsg = document.getElementById('errorMsg');

userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage() });

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = content;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

let currentAssistantMsg = null;

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || sendBtn.disabled) return;

  userInput.value = '';
  errorMsg.style.display = 'none';
  addMessage('user', text);

  sendBtn.disabled = true;
  typingIndicator.classList.add('show');

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    if (!response.ok) throw new Error('Server error');

    typingIndicator.classList.remove('show');
    currentAssistantMsg = addMessage('assistant', '');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.token) currentAssistantMsg.textContent += parsed.token;
          chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch {}
      }
    }
  } catch (err) {
    typingIndicator.classList.remove('show');
    if (currentAssistantMsg && !currentAssistantMsg.textContent) currentAssistantMsg.remove();
    errorMsg.textContent = 'Failed to get response. Check if Ollama is running.';
    errorMsg.style.display = 'block';
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}
</script>
</body>
</html>
